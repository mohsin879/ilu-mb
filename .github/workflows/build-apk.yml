name: Build ILU APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install
        run: npm install

      - name: Android project banao
        run: npx cap add android

      - name: Camera aur mic ki permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: APK banao
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK upload
        uses: actions/upload-artifact@v4
        with:
          name: ILU-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
